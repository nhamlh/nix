###########################################################
# General
###########################################################
set -g prefix C-o
set -sg escape-time 0
set -g focus-events on
set -g base-index 1
set -g allow-rename off
set -g renumber-windows on
set -g status-keys vi
set -g history-limit 50000
set -g extended-keys on
set -g mouse on

# True color + italics
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g set-clipboard on

###########################################################
# Copy mode (vi)
###########################################################
setw -g mode-keys vi

bind-key -Tcopy-mode-vi v send -X begin-selection
bind-key -Tcopy-mode-vi V send -X select-line
bind-key -Tcopy-mode-vi C-v send -X rectangle-toggle
# tmux-yank handles y/Y/mouse-drag copy — no manual binding needed

###########################################################
# Key bindings
###########################################################
# Reload config (correct path)
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

# Pane navigation — vim-aware (tmux.nvim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"
bind-key -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"

# Split panes (same PWD, vim-aware)
bind-key h if-shell "$is_vim" "send-keys C-o h" "split-window -v -c '#{pane_current_path}'"
bind-key v if-shell "$is_vim" "send-keys C-o v" "split-window -h -c '#{pane_current_path}'"

# Zoom (vim-aware)
bind-key z if-shell "$is_vim" "send-keys C-o z" "resize-pane -Z"

# Resize panes
bind-key -r M-j resize-pane -D 2
bind-key -r M-k resize-pane -U 2
bind-key -r M-h resize-pane -L 2
bind-key -r M-l resize-pane -R 2

# Window navigation
bind-key -n M-H previous-window
bind-key -n M-L next-window
bind-key -n S-Left previous-window
bind-key -n S-Right next-window

# Kill / respawn
bind-key k kill-pane
bind-key K kill-window
bind-key r respawn-pane -k

# Pane title
bind-key T run 'zsh -c "arr=( off top ) && tmux setw pane-border-status ${arr[$(( ${arr[(I)#{pane-border-status}]} % 2 + 1 ))]}"'
bind-key t command-prompt -p "(rename-pane)" -I "#T" "select-pane -T '%%'"

###########################################################
# Status line — handled by tmux-powerline plugin
###########################################################
set -g status-interval 5
set -g message-style fg=colour144,bg=colour237
set -g message-command-style fg=colour144,bg=colour237

###########################################################
# Pane styling (inactive dim — handled by tmux-inactive-panes)
###########################################################
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=blue
set-window-option -g window-active-style bg=terminal
set-window-option -g window-style bg=colour245
# set-window-option -g window-style bg=#0b0c0e # match nvim setting
